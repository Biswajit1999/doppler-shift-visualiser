name: RV covariance audit
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  numerical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_rv_covariance_audit.py' -v
      - run: python scripts/run_rv_covariance_audit.py --output /tmp/rv.json --figure /tmp/rv.png
